data_warehouse:
  # Select the warehouse with DBT_TARGET. Defaults to duckdb so that `dbt parse`,
  # `dbt build`, and sqlfluff's dbt templater all work with no credentials
  # present -- which is what local dev and CI rely on.
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"

  outputs:
    # --- DuckDB ---
    # Lightweight local development and CI. No credentials required.
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'dev.duckdb') }}"
      threads: 4

    # --- Snowflake, development ---
    # Set DBT_TARGET=snowflake. Defaults are derived from who you are, so a
    # fresh personal clone (`just dbt::dev-database`) needs no configuration:
    # database ANALYTICS_PROD_<SNOWFLAKE_USER>, schema <SNOWFLAKE_USER>_DEV.
    # The database prefix must match `environment_databases.prod` in
    # dbt_project.yml (refresh_dev_database clones into the same name).
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: "{{ env_var('SNOWFLAKE_AUTHENTICATOR', 'externalbrowser') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ANALYTICS_DEV_WRITE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS_PROD_' ~ env_var('SNOWFLAKE_USER') | upper) }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'TRANSFORMING') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', env_var('SNOWFLAKE_USER') | upper ~ '_DEV') }}"
      threads: 4

    # --- Snowflake, production ---
    # Set DBT_TARGET=snowflake_prod. NO defaults: every value must come from
    # the environment, so a missing variable fails loudly instead of quietly
    # resolving to something. Key-pair auth for the service user.
    snowflake_prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 8

    # --- PostgreSQL ---
    # Set DBT_TARGET=postgres and supply POSTGRES_* env vars.
    # Requires the `postgres` extra: `uv sync --extra postgres`.
    postgres:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DBNAME') }}"
      schema: "{{ env_var('POSTGRES_SCHEMA', 'public') }}"
      threads: 4

    # --- BigQuery ---
    # Set DBT_TARGET=bigquery and supply BIGQUERY_* env vars.
    # Requires the `bigquery` extra: `uv sync --extra bigquery`.
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('BIGQUERY_PROJECT') }}"
      dataset: "{{ env_var('BIGQUERY_DATASET') }}"
      location: "{{ env_var('BIGQUERY_LOCATION', 'US') }}"
      threads: 4

version: 2

models:
  - name: fct_monthly_cost
    config:
      tags: [cost, warehouse_spend]  # workload, entity (docs/patterns/tagging.md)
    description: >
      Snowflake spend per month, team, workload, and warehouse, in the invoice
      currency. Durable: keeps months after ACCOUNT_USAGE drops their source
      rows. Every foreign key is not_null as well as related, because a NULL
      foreign key passes a relationships test silently.
      Grain: one row per cost_month, team, workload, warehouse_name, currency.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - cost_month
            - team
            - workload
            - warehouse_name
            - currency
    columns:
      - name: cost_month
        description: '{{ doc("cost_month") }}'
        tests:
          - not_null
          - relationships:
              to: ref('dim_cost_month')
              field: cost_month
      - name: team
        description: '{{ doc("cost_team") }}'
        tests:
          - not_null
          - relationships:
              to: ref('dim_cost_team')
              field: team
      - name: workload
        description: '{{ doc("cost_workload") }}'
        tests:
          - not_null
          - relationships:
              to: ref('dim_cost_workload')
              field: workload
      - name: warehouse_name
        description: '{{ doc("cost_warehouse_name") }}'
        tests:
          - not_null
          - relationships:
              to: ref('dim_cost_warehouse')
              field: warehouse_name
      - name: currency
        description: Invoice currency
      - name: credits
        description: Credits behind the cost, where the usage is in credits
      - name: cost
        description: Cost in the invoice currency
        tests:
          - not_null
          - ties_to_control_total:
              period_column: cost_month
              control: ref('stg_snowflake__usage_in_currency_daily')
              control_period_column: usage_month
              control_value_column: usage_in_currency
              tolerance: 0.01

  - name: mart_monthly_cost_summary
    config:
      tags: [cost, warehouse_spend]  # workload, entity (docs/patterns/tagging.md)
    description: Monthly total with its SHARED and NEEDS_OWNER_REVIEW shares, reported rather than hidden
    columns:
      - name: cost_month
        description: Month
        tests:
          - unique
          - not_null
      - name: total_cost
        description: Total invoiced cost for the month
      - name: shared_cost
        description: Idle, cloud services, and other shared usage
      - name: needs_owner_review_cost
        description: Spend with no mapped owner
      - name: shared_share
        description: shared_cost / total_cost
      - name: needs_owner_review_share
        description: needs_owner_review_cost / total_cost

  - name: fct_monthly_cost_per_unit
    description: Optional cost per business unit; enabled by the cost_unit_model var
    columns:
      - name: cost_per_unit
        description: Monthly team cost / units

version: 2

models:
  - name: dim_cost_month
    description: Month spine from the cost_start_month var to next month; not derived from the fact
    columns:
      - name: cost_month
        description: Month, first day
        tests:
          - unique
          - not_null
  - name: dim_cost_team
    description: Teams from the mapping seeds, plus SHARED and NEEDS_OWNER_REVIEW
    columns:
      - name: team
        description: Team
        tests:
          - unique
          - not_null
  - name: dim_cost_workload
    description: Workloads from cost_user_mapping, plus the allocation's fixed buckets
    columns:
      - name: workload
        description: Workload
        tests:
          - unique
          - not_null
  - name: dim_cost_warehouse
    description: Accumulating list of every warehouse ever metered, plus NONE
    columns:
      - name: warehouse_name
        description: Warehouse
        tests:
          - unique
          - not_null
      - name: first_seen_at
        description: First metered hour
      - name: last_seen_at
        description: Last metered hour

version: 2

sources:
  - name: raw
    description: Raw data loaded by Airbyte or dlt
    # On a real warehouse this is the `raw` schema the EL tool loads. On duckdb
    # the example seeds in seeds/example_raw/ stand in for it, and this follows
    # generate_schema_name to wherever they land: `example_raw` when the
    # environment is prod, `<target schema>_example_raw` otherwise. Override
    # with the `raw_schema` var.
    #
    # Checks DBT_ENV as well as var('dbt_env'): in property YAML, var() sees
    # --vars overrides but not the env_var() default dbt_project.yml gives it,
    # so DBT_ENV=prod alone would otherwise resolve to the dev schema.
    schema: >-
      {{ var('raw_schema',
             ('example_raw' if var('dbt_env') == 'prod' or env_var('DBT_ENV', 'dev') == 'prod'
              else target.schema ~ '_example_raw')
             if target.type == 'duckdb' else 'raw') }}
    tables:
      - name: orders
        description: Raw orders from the source system
        columns:
          - name: id
            description: Primary key
            tests:
              - unique
              - not_null
          - name: customer_id
            description: Customer who placed the order
          - name: created_at
            description: Order creation timestamp
      - name: customers
        description: Raw customer records from the source system
        columns:
          - name: id
            description: Primary key
            tests:
              - unique
              - not_null
          - name: email
            description: Customer email address
      - name: order_daily_totals
        description: >
          Independent daily revenue totals from the system of record (e.g. a
          ledger). Contains complete days only. Used as the control total for
          fct_daily_order_revenue.
        columns:
          - name: order_date
            description: Day the total covers
          - name: revenue
            description: Recorded revenue for the day
      - name: orchestrator_run_events
        description: >
          Orchestrator run lifecycle events, appended by the Dagster telemetry
          sensors (orchestration/dagster/src/telemetry/). One row per event;
          a run can have duplicate STARTED rows.
        columns:
          - name: run_id
            description: Orchestrator run id
            tests:
              - not_null
          - name: status
            description: STARTED, SUCCESS, or FAILURE
            tests:
              - accepted_values:
                  values: ["STARTED", "SUCCESS", "FAILURE"]
          - name: event_at
            description: When the event happened, UTC
      - name: delivery_confirmations
        description: >
          Transfers a transport confirmed: one row per file seen arriving
          (SFTP server log, object-store event, API acknowledgement). Filled by
          per-transport glue; this contract is the portable part. Read by
          fct_delivery_reconciliation.
        columns:
          - name: recipient
            description: Recipient name, as in the file-export config
            tests:
              - not_null
          - name: file_name
            description: Base name of the file that arrived
            tests:
              - not_null
          - name: confirmed_at
            description: When the transport confirmed the file, UTC
            tests:
              - not_null
          - name: transport
            description: Which transport confirmed it, e.g. sftp or s3

  - name: file_export
    description: >
      Tables written by delivery/file-export. On duckdb the example seeds in
      seeds/example_raw/ stand in, as for the `raw` source.
    schema: >-
      {{ var('file_export_schema',
             ('example_raw' if var('dbt_env') == 'prod' or env_var('DBT_ENV', 'dev') == 'prod'
              else target.schema ~ '_example_raw')
             if target.type == 'duckdb' else 'file_export') }}
    tables:
      - name: export_run_log
        description: >
          One row per export attempt (delivery/file-export/src/file_export/runlog.py).
          `files` is a newline-separated list of the paths written.
        columns:
          - name: run_id
            description: Export run id
            tests:
              - unique
              - not_null
          - name: status
            description: success or failure
            tests:
              - accepted_values:
                  values: ["success", "failure"]

version: 2

seeds:
  - name: snowflake_database_storage_usage_history
    description: >
      Example fixture standing in for SNOWFLAKE.ACCOUNT_USAGE.DATABASE_STORAGE_USAGE_HISTORY,
      a subset of its columns, so the cost models (models/cost/) build on duckdb. Delete seeds/example_raw/ in
      a real project.
    config:
      meta:
        owner: data-platform
      column_types:
        usage_date: date
        database_name: varchar
        average_database_bytes: double
        average_failsafe_bytes: double
    columns:
      - name: database_name
        description: Database name
        tests:
          - not_null

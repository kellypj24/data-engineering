version: 2

seeds:
  - name: snowflake_query_attribution_history
    description: >
      Example fixture standing in for SNOWFLAKE.ACCOUNT_USAGE.QUERY_ATTRIBUTION_HISTORY,
      a subset of its columns, so the cost models (models/cost/) build on duckdb. Delete seeds/example_raw/ in
      a real project.
    config:
      meta:
        owner: data-platform
      column_types:
        query_id: varchar
        warehouse_name: varchar
        user_name: varchar
        start_time: timestamp
        credits_attributed_compute: double
    columns:
      - name: query_id
        description: Query id
        tests:
          - not_null

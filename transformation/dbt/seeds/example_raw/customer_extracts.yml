version: 2

seeds:
  - name: customer_extracts
    description: >
      Example fixture standing in for raw.customer_extracts: archived full
      extracts of customers, one row per customer per extract date. The last
      extract equals the customers fixture, so a go-forward snapshot can start
      from int_customers_history. Covers a change (1), an absence and an
      unchanged reappearance (2), and a disappearance (3). Delete
      seeds/example_raw/ in a real project.
    config:
      meta:
        owner: data-platform
      column_types:
        extract_date: date
        id: integer
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id, extract_date]
    columns:
      - name: extract_date
        description: Date of the full extract this row came from
        data_tests:
          - not_null
      - name: id
        description: Customer id
        data_tests:
          - not_null
      - name: email
        description: Email as of this extract

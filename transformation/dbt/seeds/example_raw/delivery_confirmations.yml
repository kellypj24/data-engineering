version: 2

seeds:
  - name: delivery_confirmations
    description: >
      Example fixture standing in for raw.delivery_confirmations. Against
      export_run_log it yields one of each reconciliation state: delivered,
      late, missing, and unexpected. Delete seeds/example_raw/ in a real
      project.
    config:
      meta:
        owner: data-platform
      column_types:
        recipient: varchar
        file_name: varchar
        confirmed_at: timestamp
        transport: varchar
    columns:
      - name: file_name
        description: Base name of the file that arrived
        tests:
          - not_null

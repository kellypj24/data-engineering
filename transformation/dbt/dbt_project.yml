name: data_warehouse
version: "1.0.0"

require-dbt-version: ">=1.8.0"

profile: data_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
asset-paths: ["assets"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Environment is deliberately independent of the target. A target says *which
  # warehouse* (duckdb, snowflake, postgres, bigquery); this says *which
  # environment*. Branching on `target.name` instead conflates the two, and the
  # dev/prod branches silently never fire -- which is exactly what happened
  # before this var existed.
  dbt_env: "{{ env_var('DBT_ENV', 'dev') }}"

  # Validation framework (macros/validation/README.md). Behaviour changes here,
  # not in code: per-validation overrides, which validations escalate MEDIUM
  # failures, and severity -> channel routing.
  validation_configs: {}
  high_priority_validations: []
  validation_notification_channels:
    CRITICAL: "#data-alerts"
    HIGH: "#data-alerts"
    MEDIUM: "#data-quality"
    LOW: "#data-quality"

  # Jobs left out of mart_orchestrator_run_summary: the job that refreshes the
  # monitoring models would otherwise report on itself.
  orchestrator_monitoring_jobs: ["refresh_monitoring"]

  # fct_delivery_reconciliation: a written file must be confirmed within this
  # many minutes of its export run finishing, or it is late (or missing).
  delivery_grace_minutes: 60

  # Environment -> database, for refresh_environment / clone_database
  # (macros/snowflake/). Matches infrastructure/terraform/snowflake and the
  # Dagster deployment routing. `prod` is the clone source and is never a target.
  environment_databases:
    prod: ANALYTICS_PROD
    stage: ANALYTICS_STAGE
    dev: ANALYTICS_DEV

  # Objects dbt does not manage that a cloned environment must get back
  # (macros/utils/preserve_objects.sql; Snowflake example in
  # macros/snowflake/README.md). refresh_environment restores them after the
  # clone.
  preservation_manifest: []

  # The allowed tags, per axis (docs/patterns/tagging.md). check_tag_contract
  # fails on any model tag not listed here, and on a model without exactly one
  # layer tag. A value may belong to one axis only.
  tag_taxonomy:
    layer: [staging, intermediate, marts, validation]
    workload: [revenue, delivery, observability, cost, data_quality]
    entity: [order, customer, run, export_file, warehouse_spend]

  # generate_semantic_view (macros/snowflake/semantic_view.sql): the parts of a
  # semantic view that must stay hand-curated, per domain (workload tag), e.g.
  #   revenue:
  #     metrics: ["fct_orders.total_amount AS SUM(fct_orders.amount)"]
  #     relationships: []
  #     synonyms: {fct_orders: [orders]}
  semantic_views: {}

  # Cost attribution (models/cost/): first month of the month spine, months the
  # durable fact restates, and an optional per-unit denominator model.
  cost_start_month: "2026-01-01"
  cost_restate_months: 2

models:
  data_warehouse:
    # Layer tags are set here, by directory, and nowhere else: exactly one per
    # model, enforced by `dbt run-operation check_tag_contract`. Workload and
    # entity tags are set by hand in each model's .yml. See
    # docs/patterns/tagging.md and docs/adr/0006-three-axis-tags.md.
    staging:
      +materialized: view
      +schema: staging
      +tags: [staging]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: [intermediate]
    marts:
      +materialized: table
      +schema: marts
      +tags: [marts]
    validation:
      +materialized: table
      +schema: validation
      +tags: [validation]
    # Snowflake cost attribution (E27). Reads SNOWFLAKE.ACCOUNT_USAGE on
    # Snowflake, the seeds/example_raw fixtures on duckdb; off on other adapters.
    cost:
      +materialized: table
      +schema: cost
      +enabled: "{{ target.type in ['snowflake', 'duckdb'] }}"
      staging:
        +materialized: view
        +tags: [staging]
      intermediate:
        +tags: [intermediate]
      marts:
        +tags: [marts]

seeds:
  data_warehouse:
    # Every seed is dropped and recreated on every `dbt seed`. dbt's default is
    # truncate-and-insert with an INSERT that names the CSV's columns, so the
    # first run after a CSV gains a column fails with `invalid identifier` and
    # stays failing until someone passes --full-refresh by hand. A seed is fully
    # defined by its CSV, so recreating it is always equivalent to reloading it.
    +full_refresh: true
    +quote_columns: true
    # Seeds need their own persist_docs; a models-level setting does not apply.
    +persist_docs:
      relation: true
      columns: true
    # Stand-ins for the raw sources, so the example project builds on duckdb
    # with no EL tool. source('raw', ...) resolves to their schema on duckdb
    # (see models/staging/_sources.yml). Disabled on every other adapter, so
    # they can never write fake rows into a real warehouse. Their own schema
    # name (not `raw`) keeps their Dagster asset keys distinct from the
    # sources' ["raw", <table>] keys.
    example_raw:
      +schema: example_raw
      +enabled: "{{ target.type == 'duckdb' }}"

snapshots:
  data_warehouse:
    +strategy: timestamp

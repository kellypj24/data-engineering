name: data_warehouse
version: "1.0.0"

require-dbt-version: ">=1.8.0"

profile: data_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
asset-paths: ["assets"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Environment is deliberately independent of the target. A target says *which
  # warehouse* (duckdb, snowflake, postgres, bigquery); this says *which
  # environment*. Branching on `target.name` instead conflates the two, and the
  # dev/prod branches silently never fire -- which is exactly what happened
  # before this var existed.
  dbt_env: "{{ env_var('DBT_ENV', 'dev') }}"

models:
  data_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  data_warehouse:
    # Every seed is dropped and recreated on every `dbt seed`. dbt's default is
    # truncate-and-insert with an INSERT that names the CSV's columns, so the
    # first run after a CSV gains a column fails with `invalid identifier` and
    # stays failing until someone passes --full-refresh by hand. A seed is fully
    # defined by its CSV, so recreating it is always equivalent to reloading it.
    +full_refresh: true
    +quote_columns: true
    # Seeds need their own persist_docs; a models-level setting does not apply.
    +persist_docs:
      relation: true
      columns: true

snapshots:
  data_warehouse:
    +strategy: timestamp

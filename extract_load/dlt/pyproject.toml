[project]
name = "dlt-pipelines"
version = "0.1.0"
description = "Data ingestion pipelines built with dlt"
requires-python = ">=3.10"
dependencies = [
    "dlt[duckdb,snowflake,filesystem]>=1.29.1",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

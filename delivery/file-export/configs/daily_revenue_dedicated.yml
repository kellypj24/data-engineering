# Dedicated export: each recipient has its own model with its filters baked
# in, so the YAML carries delivery settings only.
name: daily-revenue
kind: dedicated
owner:
  name: data-platform

outputs:
  - path: "{recipient}/daily_revenue_{run_date}.csv"
    delimiter: "|"

recipients:
  - name: north
    source: marts.fct_daily_order_revenue
    schedule:
      cron: "0 5 * * *"

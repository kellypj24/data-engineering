name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      dagster: ${{ steps.filter.outputs.dagster }}
      airflow: ${{ steps.filter.outputs.airflow }}
      prefect: ${{ steps.filter.outputs.prefect }}
      temporal: ${{ steps.filter.outputs.temporal }}
      dbt: ${{ steps.filter.outputs.dbt }}
      dlt: ${{ steps.filter.outputs.dlt }}
      airbyte: ${{ steps.filter.outputs.airbyte }}
      file_export: ${{ steps.filter.outputs.file_export }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            dagster:
              - 'orchestration/dagster/**'
            airflow:
              - 'orchestration/airflow/**'
            prefect:
              - 'orchestration/prefect/**'
            temporal:
              - 'orchestration/temporal/**'
            dbt:
              - 'transformation/dbt/**'
            dlt:
              - 'extract_load/dlt/**'
            airbyte:
              - 'extract_load/airbyte/**'
            file_export:
              - 'delivery/file-export/**'

  resolve-impacts:
    runs-on: ubuntu-latest
    needs: detect-changes
    outputs:
      test-dagster: ${{ steps.resolve.outputs.test-dagster }}
      test-airflow: ${{ steps.resolve.outputs.test-airflow }}
      test-prefect: ${{ steps.resolve.outputs.test-prefect }}
      test-temporal: ${{ steps.resolve.outputs.test-temporal }}
      test-dlt: ${{ steps.resolve.outputs.test-dlt }}
      test-file-export: ${{ steps.resolve.outputs.test-file-export }}
    steps:
      - id: resolve
        run: |
          # Direct changes
          test_dagster="${{ needs.detect-changes.outputs.dagster }}"
          test_airflow="${{ needs.detect-changes.outputs.airflow }}"
          test_prefect="${{ needs.detect-changes.outputs.prefect }}"
          test_temporal="${{ needs.detect-changes.outputs.temporal }}"
          test_dlt="${{ needs.detect-changes.outputs.dlt }}"
          test_file_export="${{ needs.detect-changes.outputs.file_export }}"

          # Cross-paradigm: dbt changes affect all orchestrators that wrap dbt
          if [ "${{ needs.detect-changes.outputs.dbt }}" = "true" ]; then
            test_dagster="true"
            test_airflow="true"
            test_prefect="true"
          fi

          # Cross-paradigm: airbyte changes affect orchestrators that trigger syncs
          if [ "${{ needs.detect-changes.outputs.airbyte }}" = "true" ]; then
            test_dagster="true"
            test_airflow="true"
            test_prefect="true"
          fi

          echo "test-dagster=$test_dagster" >> "$GITHUB_OUTPUT"
          echo "test-airflow=$test_airflow" >> "$GITHUB_OUTPUT"
          echo "test-prefect=$test_prefect" >> "$GITHUB_OUTPUT"
          echo "test-temporal=$test_temporal" >> "$GITHUB_OUTPUT"
          echo "test-dlt=$test_dlt" >> "$GITHUB_OUTPUT"
          echo "test-file-export=$test_file_export" >> "$GITHUB_OUTPUT"

  test-dagster:
    runs-on: ubuntu-latest
    needs: resolve-impacts
    if: needs.resolve-impacts.outputs.test-dagster == 'true'
    defaults:
      run:
        working-directory: orchestration/dagster
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Parse the dbt project
        # src/assets/dbt.py builds @dbt_assets from target/manifest.json and
        # skips without it; parse so the dbt assets are actually loaded.
        working-directory: transformation/dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          uv sync --dev
          uv run dbt deps
          uv run dbt parse
      - run: uv sync --dev
      - run: uv run pytest tests/ -v --tb=short
        env:
          DAGSTER_REQUIRE_DBT_MANIFEST: "1"

  test-airflow:
    runs-on: ubuntu-latest
    needs: resolve-impacts
    if: needs.resolve-impacts.outputs.test-airflow == 'true'
    defaults:
      run:
        working-directory: orchestration/airflow
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - run: uv run pytest tests/ -v --tb=short

  test-prefect:
    runs-on: ubuntu-latest
    needs: resolve-impacts
    if: needs.resolve-impacts.outputs.test-prefect == 'true'
    defaults:
      run:
        working-directory: orchestration/prefect
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - run: uv run pytest tests/ -v --tb=short

  test-temporal:
    runs-on: ubuntu-latest
    needs: resolve-impacts
    if: needs.resolve-impacts.outputs.test-temporal == 'true'
    defaults:
      run:
        working-directory: orchestration/temporal
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - run: uv run pytest tests/ -v --tb=short

  test-dlt:
    runs-on: ubuntu-latest
    needs: resolve-impacts
    if: needs.resolve-impacts.outputs.test-dlt == 'true'
    defaults:
      run:
        working-directory: extract_load/dlt
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - run: uv run pytest tests/ -v --tb=short

  # Generated dbt exposures must match the export configs and the dbt project.
  # Either side can make them stale, so this runs when either changes.
  exposures-drift:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.file_export == 'true' || needs.detect-changes.outputs.dbt == 'true'
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Parse the dbt project (no warehouse needed)
        working-directory: transformation/dbt
        run: |
          uv sync --dev
          uv run dbt deps
          uv run dbt parse
      - name: Check generated exposures
        working-directory: delivery/file-export
        run: |
          uv sync --dev
          uv run file-export exposures --check \
            --manifest ../../transformation/dbt/target/manifest.json \
            --out ../../transformation/dbt/models/exports/_generated_exposures.yml

  test-file-export:
    runs-on: ubuntu-latest
    needs: resolve-impacts
    if: needs.resolve-impacts.outputs.test-file-export == 'true'
    defaults:
      run:
        working-directory: delivery/file-export
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      # Includes validating every config under configs/, so a broken export
      # config fails the PR instead of the scheduled run.
      - run: uv run pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # `srcs` feeds both `ruff check` and `ruff format --check` so the two
        # can never drift apart. Keep it in sync with the tool's mod.just.
        include:
          - tool: dagster
            path: orchestration/dagster
            srcs: src/ tests/
          - tool: airflow
            path: orchestration/airflow
            srcs: dags/ tests/
          - tool: prefect
            path: orchestration/prefect
            srcs: flows/ blocks/ tests/
          - tool: temporal
            path: orchestration/temporal
            srcs: workflows/ activities/ workers/ tests/
          - tool: dlt
            path: extract_load/dlt
            srcs: pipelines/ tests/
          - tool: file-export
            path: delivery/file-export
            srcs: src/ tests/
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install ${{ matrix.tool }}
        working-directory: ${{ matrix.path }}
        run: uv sync --dev
      - name: Lint ${{ matrix.tool }}
        working-directory: ${{ matrix.path }}
        run: uv run ruff check ${{ matrix.srcs }}
      # Formatting drifted unnoticed for a long time because CI only ever ran
      # `ruff check`, which does not look at formatting. Runs even if lint
      # fails, so one push surfaces both.
      - name: Check formatting ${{ matrix.tool }}
        if: '!cancelled()'
        working-directory: ${{ matrix.path }}
        run: uv run ruff format --check ${{ matrix.srcs }}

  # dbt is kept out of the `lint` matrix above because it needs its dbt packages
  # installed before sqlfluff can run -- the templater compiles the project, so
  # `dbt deps` is a prerequisite for linting a single .sql file.
  lint-dbt:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.dbt == 'true'
    defaults:
      run:
        working-directory: transformation/dbt
    env:
      # profiles.yml lives in the project directory, not ~/.dbt.
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - name: Install dbt packages
        run: uv run dbt deps
      - name: Lint SQL
        run: uv run sqlfluff lint models/ macros/
      - name: Lint YAML
        run: uv run yamllint --strict .

  test-dbt:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.dbt == 'true'
    defaults:
      run:
        working-directory: transformation/dbt
    env:
      # Defaults to the duckdb target, so this runs with no warehouse
      # credentials -- see profiles.yml.
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - name: Install dbt packages
        run: uv run dbt deps
      - name: Parse project
        # Validates schema YAML, ref()/source() resolution, and macro syntax.
        run: uv run dbt parse
      - name: Compile models
        # Renders every model's Jinja to SQL. Catches broken macros and bad
        # column references that `parse` alone does not reach.
        run: uv run dbt compile
      - name: Build on the example fixtures
        # seeds/example_raw/ stands in for the raw sources on duckdb, so this
        # runs every model, data test, and unit test with no credentials. Seed
        # first: models read the fixtures via source(), which dbt does not
        # order after seeds. DBT_ENV=prod keeps limit_data_in_dev from
        # filtering the fixed-date fixtures out.
        env:
          DBT_ENV: prod
        run: |
          uv run dbt seed
          uv run dbt build
      - name: Run operation tests
        # pytest runs dbt in-process on a throwaway copy of the project:
        # run-operations, seed behaviour, the durable fact, a full build.
        run: uv run pytest tests/python

  # Deliberately unconditional: this is a guard, and a guard that skips is not a
  # guard. It is also cheap -- `uv lock --check` resolves metadata only, with no
  # package installs. See the header comment in .github/dependabot.yml.
  lockfiles:
    name: Lockfiles in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Verify each uv.lock matches its pyproject.toml
        run: |
          failed=0
          for dir in \
            delivery/file-export \
            extract_load/dlt \
            orchestration/airflow \
            orchestration/dagster \
            orchestration/prefect \
            orchestration/temporal \
            transformation/dbt
          do
            if uv lock --check --directory "$dir" >/dev/null 2>&1; then
              echo "  in sync    $dir"
            else
              echo "  DRIFTED    $dir"
              echo "::error file=$dir/uv.lock,title=Lockfile out of sync::$dir/uv.lock does not match its pyproject.toml. Run 'uv lock' in $dir and commit the result."
              failed=1
            fi
          done
          exit $failed

  wiring:
    name: Tools wired into every surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Each tool must be in the root justfile aggregates, ci.yml, dependabot,
      # and the README table -- see .github/scripts/check_wiring.py.
      - run: uv run --no-project --with pyyaml python .github/scripts/check_wiring.py
      - run: uv run --no-project --with pyyaml --with pytest pytest .github/scripts -q

  # The single required status check. Every other job skips on unrelated PRs,
  # so none of them can be required directly; this one always runs and fails
  # only if a dependency failed or was cancelled (skipped is fine). It is
  # required by a ruleset with NO bypass actors, so even an admin merge cannot
  # skip a red CI -- see docs/ci-cd-hardening.md #4.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect-changes
      - resolve-impacts
      - test-dagster
      - test-airflow
      - test-prefect
      - test-temporal
      - test-dlt
      - exposures-drift
      - test-file-export
      - lint
      - lint-dbt
      - test-dbt
      - lockfiles
      - wiring
    steps:
      - uses: actions/checkout@v7
      # A job missing from `needs` would never gate a merge, and nothing else
      # would notice. yq is preinstalled on GitHub's Ubuntu runners.
      - name: Every job in this workflow is in needs
        run: |
          all=$(yq '.jobs | keys | .[]' .github/workflows/ci.yml | grep -vx ci-success | sort)
          needed=$(yq '.jobs["ci-success"].needs[]' .github/workflows/ci.yml | sort)
          if [ "$all" != "$needed" ]; then
            echo "ci-success.needs is out of sync with the jobs in ci.yml:"
            diff <(echo "$all") <(echo "$needed") || true
            exit 1
          fi
      - name: Fail if any dependency failed or was cancelled
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - name: Success
        run: echo "All jobs passed or were skipped."

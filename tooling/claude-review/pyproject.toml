[project]
name = "claude-review"
version = "0.1.0"
description = "Opt-in, fail-open Claude review of a push, gated by sensitive-scan; pre-commit pre-push hook"
requires-python = ">=3.11"
dependencies = []  # stdlib only: it runs as a git hook without a venv

[project.scripts]
claude-review = "claude_review.review:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.10",
    "sensitive-scan",
]

[tool.uv.sources]
# The gate. At runtime the script also finds it as a sibling directory.
sensitive-scan = { path = "../sensitive-scan", editable = true }

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

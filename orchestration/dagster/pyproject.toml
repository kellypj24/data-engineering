[project]
name = "dagster-orchestration"
version = "0.1.0"
description = "Composable data engineering toolkit powered by Dagster"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.13.16,<2.0",
    "dagster-webserver>=1.6,<2.0",
    "dagster-dbt>=0.22,<1.0",
    "dagster-airbyte>=0.22,<1.0",
    "dagster-snowflake>=0.29.0,<1.0",
    "boto3>=1.42.88,<2.0",
    "dbt-core>=1.11.8,<2.0",
    "dbt-snowflake>=1.12.0,<2.0",
]

[dependency-groups]
dev = [
    "dagster-webserver>=1.6,<2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.dagster]
module_name = "src"

[project]
name = "prefect-orchestration"
version = "0.1.0"
description = "Prefect flows for data pipeline orchestration"
requires-python = ">=3.11"
dependencies = [
    "prefect>=3.6.26",
    "boto3>=1.42.88,<2.0",
    "requests>=2.31.0",
    "prefect-snowflake>=0.28.8",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flows*", "blocks*", "schedules*"]

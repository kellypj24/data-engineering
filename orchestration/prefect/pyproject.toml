[project]
name = "prefect-orchestration"
version = "0.1.0"
description = "Prefect flows for data pipeline orchestration"
requires-python = ">=3.11"
dependencies = [
    "prefect>=3.8.1",
    "boto3>=1.43.64,<2.0",
    "requests>=2.34.2",
    "prefect-snowflake>=0.28.8",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flows*", "blocks*", "schedules*"]

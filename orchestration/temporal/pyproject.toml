[project]
name = "temporal-orchestration"
version = "0.1.0"
description = "Temporal workflows for data pipeline orchestration"
requires-python = ">=3.10"
dependencies = [
    "temporalio>=1.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "temporalio[testing]>=1.30.0",
    "ruff>=0.15.10",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["workflows*", "activities*", "workers*"]
